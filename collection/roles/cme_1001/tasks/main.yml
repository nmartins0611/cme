---
# CME-1001: EDR Agent (Endpoint Detection & Response)

- name: "CME-1001 | Skip if disabled"
  ansible.builtin.meta: end_role
  when: cme_1001_skip | default(false)

- name: "CME-1001 | Ensure falco is installed"
  ansible.builtin.package:
    name: falco
    state: present
  when: ansible_os_family != 'Windows'

- name: "CME-1001 | Ensure falco is running and enabled"
  ansible.builtin.systemd:
    name: falco
    state: started
    enabled: true
  when: ansible_os_family != 'Windows'

- name: "CME-1001 | Verify after remediation"
  ansible.builtin.include_tasks: verify.yml
