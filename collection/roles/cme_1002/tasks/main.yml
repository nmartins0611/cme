---
# CME-1002: Audit Subsystem (auditd)


- name: "CME-1002 | Ensure audit is installed"
  ansible.builtin.package:
    name: audit
    state: present
  when: ansible_os_family != 'Windows'

- name: "CME-1002 | Ensure auditd is running and enabled"
  ansible.builtin.systemd:
    name: auditd
    state: started
    enabled: true
  when: ansible_os_family != 'Windows'

- name: "CME-1002 | Verify after remediation"
  ansible.builtin.include_tasks: verify.yml
