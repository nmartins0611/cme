---
# CME-1003: Falco / eBPF Runtime Security


- name: "CME-1003 | Ensure falco is installed"
  ansible.builtin.package:
    name: falco
    state: present
  when: ansible_os_family != 'Windows'

- name: "CME-1003 | Ensure falco is running and enabled"
  ansible.builtin.systemd:
    name: falco
    state: started
    enabled: true
  when: ansible_os_family != 'Windows'

- name: "CME-1003 | Verify after remediation"
  ansible.builtin.include_tasks: verify.yml
