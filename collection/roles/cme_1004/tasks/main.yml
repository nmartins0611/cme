---
# CME-1004: AIDE / File Integrity Monitoring

- name: "CME-1004 | Skip if disabled"
  ansible.builtin.meta: end_role
  when: cme_1004_skip | default(false)

- name: "CME-1004 | Ensure aide is installed"
  ansible.builtin.package:
    name: aide
    state: present
  when: ansible_os_family != 'Windows'

- name: "CME-1004 | Ensure aide is running and enabled"
  ansible.builtin.systemd:
    name: aide
    state: started
    enabled: true
  when: ansible_os_family != 'Windows'

- name: "CME-1004 | Verify after remediation"
  ansible.builtin.include_tasks: verify.yml
