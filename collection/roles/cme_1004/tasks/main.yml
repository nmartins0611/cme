---
# CME-1004: AIDE / File Integrity Monitoring
# Remediation strategy: generic (review and customize for your environment)
# Verification method: Verify AIDE is installed and database is initialized

- name: "CME-1004 | Remediation requires environment-specific configuration"
  ansible.builtin.debug:
    msg: >-
      CME-1004 (AIDE / File Integrity Monitoring) remediation depends on your
      environment configuration. Override this role's tasks/main.yml
      with site-specific remediation steps.
  when: not (cme_1004_custom_remediation | default(false))

- name: "CME-1004 | Verify current state"
  ansible.builtin.include_tasks: verify.yml
