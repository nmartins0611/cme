---
# CME-1004: AIDE / File Integrity Monitoring
# Verification: Verify AIDE is installed and database is initialized

- name: "CME-1004 | Run verification command"
  ansible.builtin.shell:
    cmd: "aide --check 2>/dev/null; echo $?"
  register: cme_1004_verify_0
  changed_when: false
  failed_when: false
  when: ansible_os_family != 'Windows'

- name: "CME-1004 | Assert control is active"
  ansible.builtin.assert:
    that:
      - "cme_1004_verify_0.stdout is search('0')"
    fail_msg: "CME-1004 FAILED — expected '0'"
    success_msg: "CME-1004 PASSED — AIDE / File Integrity Monitoring"
  ignore_errors: true
  register: cme_1004_assert_0
  when: ansible_os_family != 'Windows' and cme_1004_verify_0 is not skipped

- name: "CME-1004 | Record result"
  ansible.builtin.set_fact:
    cme_results: "{{ (cme_results | default([])) + [{'cme_id': 'CME-1004', 'control_name': 'AIDE / File Integrity Monitoring', 'tactic': 'Detect', 'category': 'Integrity Detection', 'control_layer': 'OS/Kernel', 'confidence': 'Medium', 'status': ((cme_1004_assert_0 is defined and cme_1004_assert_0 is not failed) | ternary('passed', 'failed')), 'detail': ((cme_1004_assert_0 is defined) | ternary(cme_1004_assert_0.msg | default(''), 'not checked'))}] }}"
