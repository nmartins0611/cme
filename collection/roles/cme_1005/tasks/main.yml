---
# CME-1005: Runtime Memory Error Detection (KASAN/HWASan)
# Remediation strategy: generic (review and customize for your environment)
# Verification method: Check if KASAN is enabled in kernel config


- name: "CME-1005 | Remediation requires environment-specific configuration"
  ansible.builtin.debug:
    msg: >-
      CME-1005 (Runtime Memory Error Detection (KASAN/HWASan)) remediation depends on your
      environment configuration. Override this role's tasks/main.yml
      with site-specific remediation steps.
  when: not (cme_1005_custom_remediation | default(false))

- name: "CME-1005 | Verify current state"
  ansible.builtin.include_tasks: verify.yml
