    msg: >-
      CME-1008 (Application Admin Event Logging (SIEM Integration)) remediation depends on your
      environment configuration. Override this role's tasks/main.yml
      with site-specific remediation steps.
  when: not (cme_1008_custom_remediation | default(false))

- name: "CME-1008 | Verify current state"
  ansible.builtin.include_tasks: verify.yml
