---
# CME-1008: Application Admin Event Logging (SIEM Integration)
# Verification: Verify that application admin event logging is enabled and events are forwarded to the SIEM. Perform a sensitive administrative action and confirm the event appears in the SIEM within the expected latency.

- name: "CME-1008 | Run verification command"
  ansible.builtin.shell:
    cmd: "kcadm.sh get events/config -r master --fields eventsEnabled,adminEventsEnabled,adminEventsDetailsIncluded"
  register: cme_1008_verify_0
  changed_when: false
  failed_when: false

- name: "CME-1008 | Assert control is active"
  ansible.builtin.assert:
    that:
      - "cme_1008_verify_0.stdout is search('adminEventsEnabled: true, adminEventsDetailsIncluded: true')"
    fail_msg: "CME-1008 FAILED — expected 'adminEventsEnabled: true, adminEventsDetailsIncluded: true'"
    success_msg: "CME-1008 PASSED — Application Admin Event Logging (SIEM Integration)"
  ignore_errors: true
  register: cme_1008_assert_0
  when: cme_1008_verify_0 is not skipped

- name: "CME-1008 | Record result"
  ansible.builtin.set_fact:
    cme_results: "{{ (cme_results | default([])) + [{'cme_id': 'CME-1008', 'control_name': 'Application Admin Event Logging (SIEM Integration)', 'tactic': 'Detect', 'category': 'Runtime Detection', 'control_layer': 'Application', 'confidence': 'High', 'status': ((cme_1008_assert_0 is defined and cme_1008_assert_0 is not failed) | ternary('passed', 'failed')), 'detail': ((cme_1008_assert_0 is defined) | ternary(cme_1008_assert_0.msg | default(''), 'not checked'))}] }}"
