---
# CME-1010: cgroup Memory Pressure Monitoring (memory.events / PSI)
# Remediation strategy: generic (review and customize for your environment)
# Verification method: Check that cgroup memory.events is accessible and PSI is enabled in the kernel

- name: "CME-1010 | Remediation requires environment-specific configuration"
  ansible.builtin.debug:
    msg: >-
      CME-1010 (cgroup Memory Pressure Monitoring (memory.events / PSI)) remediation depends on your
      environment configuration. Override this role's tasks/main.yml
      with site-specific remediation steps.
  when: not (cme_1010_custom_remediation | default(false))

- name: "CME-1010 | Verify current state"
  ansible.builtin.include_tasks: verify.yml
