---
# CME-103: Stack Canaries (Stack Protector)
# Remediation strategy: generic (review and customize for your environment)
# Verification method: Verify binaries compiled with -fstack-protector-strong

- name: "CME-103 | Skip if disabled"
  ansible.builtin.meta: end_role
  when: cme_103_skip | default(false)

- name: "CME-103 | Remediation requires environment-specific configuration"
  ansible.builtin.debug:
    msg: >-
      CME-103 (Stack Canaries (Stack Protector)) remediation depends on your
      environment configuration. Override this role's tasks/main.yml
      with site-specific remediation steps.
  when: not (cme_103_custom_remediation | default(false))

- name: "CME-103 | Verify current state"
  ansible.builtin.include_tasks: verify.yml
