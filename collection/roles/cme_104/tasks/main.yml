---
# CME-104: KASLR (Kernel Address Space Layout Randomization)
# Remediation strategy: generic (review and customize for your environment)
# Verification method: Verify KASLR is not disabled in boot parameters


- name: "CME-104 | Remediation requires environment-specific configuration"
  ansible.builtin.debug:
    msg: >-
      CME-104 (KASLR (Kernel Address Space Layout Randomization)) remediation depends on your
      environment configuration. Override this role's tasks/main.yml
      with site-specific remediation steps.
  when: not (cme_104_custom_remediation | default(false))

- name: "CME-104 | Verify current state"
  ansible.builtin.include_tasks: verify.yml
