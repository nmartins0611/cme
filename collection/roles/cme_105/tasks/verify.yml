---
# CME-105: SMEP (Supervisor Mode Execution Prevention)
# Verification: Check CPU flags for smep support

- name: "CME-105 | Skip if disabled"
  ansible.builtin.meta: end_role
  when: cme_105_skip | default(false)

- name: "CME-105 | Run verification command"
  ansible.builtin.shell:
    cmd: "grep -o smep /proc/cpuinfo | head -1"
  register: cme_105_verify_0
  changed_when: false
  failed_when: false
  when: ansible_os_family != 'Windows'

- name: "CME-105 | Assert control is active"
  ansible.builtin.assert:
    that:
      - "cme_105_verify_0.stdout is search('smep')"
    fail_msg: "CME-105 FAILED — expected 'smep'"
    success_msg: "CME-105 PASSED — SMEP (Supervisor Mode Execution Prevention)"
  ignore_errors: true
  register: cme_105_assert_0
  when: ansible_os_family != 'Windows' and cme_105_verify_0 is not skipped

- name: "CME-105 | Record result"
  ansible.builtin.set_fact:
    cme_results: "{{ (cme_results | default([])) + [{'cme_id': 'CME-105', 'control_name': 'SMEP (Supervisor Mode Execution Prevention)', 'tactic': 'Harden', 'category': 'Kernel Hardening', 'control_layer': 'OS/Kernel', 'confidence': 'High', 'status': ((cme_105_assert_0 is defined and cme_105_assert_0 is not failed) | ternary('passed', 'failed')), 'detail': ((cme_105_assert_0 is defined) | ternary(cme_105_assert_0.msg | default(''), 'not checked'))}] }}"
