---
# CME-107: Kernel Module Loading Restriction
# Verification: Check modules_disabled sysctl

- name: "CME-107 | Run verification command"
  ansible.builtin.shell:
    cmd: "cat /proc/sys/kernel/modules_disabled"
  register: cme_107_verify_0
  changed_when: false
  failed_when: false
  when: ansible_os_family != 'Windows'

- name: "CME-107 | Assert control is active"
  ansible.builtin.assert:
    that:
      - "cme_107_verify_0.stdout is search('1')"
    fail_msg: "CME-107 FAILED — expected '1'"
    success_msg: "CME-107 PASSED — Kernel Module Loading Restriction"
  ignore_errors: true
  register: cme_107_assert_0
  when: ansible_os_family != 'Windows' and cme_107_verify_0 is not skipped

- name: "CME-107 | Record result"
  ansible.builtin.set_fact:
    cme_results: "{{ (cme_results | default([])) + [{'cme_id': 'CME-107', 'control_name': 'Kernel Module Loading Restriction', 'tactic': 'Harden', 'category': 'Kernel Hardening', 'control_layer': 'OS/Kernel', 'confidence': 'High', 'status': ((cme_107_assert_0 is defined and cme_107_assert_0 is not failed) | ternary('passed', 'failed')), 'detail': ((cme_107_assert_0 is defined) | ternary(cme_107_assert_0.msg | default(''), 'not checked'))}] }}"
