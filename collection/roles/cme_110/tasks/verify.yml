---
# CME-110: KEXEC Restriction
# Verification: Check kexec_load_disabled sysctl

- name: "CME-110 | Run verification command"
  ansible.builtin.shell:
    cmd: "cat /proc/sys/kernel/kexec_load_disabled"
  register: cme_110_verify_0
  changed_when: false
  failed_when: false
  when: ansible_os_family != 'Windows'

- name: "CME-110 | Assert control is active"
  ansible.builtin.assert:
    that:
      - "cme_110_verify_0.stdout is search('1')"
    fail_msg: "CME-110 FAILED — expected '1'"
    success_msg: "CME-110 PASSED — KEXEC Restriction"
  ignore_errors: true
  register: cme_110_assert_0
  when: ansible_os_family != 'Windows' and cme_110_verify_0 is not skipped

- name: "CME-110 | Record result"
  ansible.builtin.set_fact:
    cme_results: "{{ (cme_results | default([])) + [{'cme_id': 'CME-110', 'control_name': 'KEXEC Restriction', 'tactic': 'Harden', 'category': 'Kernel Hardening', 'control_layer': 'OS/Kernel', 'confidence': 'High', 'status': ((cme_110_assert_0 is defined and cme_110_assert_0 is not failed) | ternary('passed', 'failed')), 'detail': ((cme_110_assert_0 is defined) | ternary(cme_110_assert_0.msg | default(''), 'not checked'))}] }}"
