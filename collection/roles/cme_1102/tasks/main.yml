---
# CME-1102: Live Kernel Patching (kpatch/livepatch)


- name: "CME-1102 | Install dnf-automatic (RedHat)"
  ansible.builtin.dnf:
    name: dnf-automatic
    state: present
  when: ansible_os_family == 'RedHat'

- name: "CME-1102 | Configure dnf-automatic to apply updates (RedHat)"
  ansible.builtin.lineinfile:
    path: /etc/dnf/automatic.conf
    regexp: "^#?apply_updates"
    line: "apply_updates = yes"
  when: ansible_os_family == 'RedHat'

- name: "CME-1102 | Enable dnf-automatic-install.timer (RedHat)"
  ansible.builtin.systemd:
    name: dnf-automatic-install.timer
    state: started
    enabled: true
  when: ansible_os_family == 'RedHat'

- name: "CME-1102 | Install unattended-upgrades (Debian)"
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
  when: ansible_os_family == 'Debian'

- name: "CME-1102 | Enable unattended-upgrades (Debian)"
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"
  when: ansible_os_family == 'Debian'

- name: "CME-1102 | Verify after remediation"
  ansible.builtin.include_tasks: verify.yml
