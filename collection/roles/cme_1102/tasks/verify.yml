---
# CME-1102: Live Kernel Patching (kpatch/livepatch)
# Verification: Check for active kernel live patches

- name: "CME-1102 | Skip if disabled"
  ansible.builtin.meta: end_role
  when: cme_1102_skip | default(false)

- name: "CME-1102 | Run verification command (rhel)"
  ansible.builtin.shell:
    cmd: "kpatch list"
  register: cme_1102_verify_0
  changed_when: false
  failed_when: false
  when: ansible_os_family == 'RedHat'

- name: "CME-1102 | Assert control is active (rhel)"
  ansible.builtin.assert:
    that:
      - "cme_1102_verify_0.stdout is search('installed')"
    fail_msg: "CME-1102 FAILED — expected 'installed'"
    success_msg: "CME-1102 PASSED — Live Kernel Patching (kpatch/livepatch)"
  ignore_errors: true
  register: cme_1102_assert_0
  when: ansible_os_family == 'RedHat' and cme_1102_verify_0 is not skipped

- name: "CME-1102 | Run verification command (debian)"
  ansible.builtin.shell:
    cmd: "canonical-livepatch status"
  register: cme_1102_verify_1
  changed_when: false
  failed_when: false
  when: ansible_os_family == 'Debian'

- name: "CME-1102 | Assert control is active (debian)"
  ansible.builtin.assert:
    that:
      - "cme_1102_verify_1.stdout is search('running')"
    fail_msg: "CME-1102 FAILED — expected 'running'"
    success_msg: "CME-1102 PASSED — Live Kernel Patching (kpatch/livepatch)"
  ignore_errors: true
  register: cme_1102_assert_1
  when: ansible_os_family == 'Debian' and cme_1102_verify_1 is not skipped

- name: "CME-1102 | Record result"
  ansible.builtin.set_fact:
    cme_results: "{{ (cme_results | default([])) + [{'cme_id': 'CME-1102', 'control_name': 'Live Kernel Patching (kpatch/livepatch)', 'tactic': 'Evict', 'category': 'Patch Management', 'control_layer': 'OS/Kernel', 'confidence': 'High', 'status': ((((cme_1102_assert_0 is not defined or cme_1102_assert_0 is not failed) and (cme_1102_assert_1 is not defined or cme_1102_assert_1 is not failed)) and (cme_1102_assert_0 is defined or cme_1102_assert_1 is defined)) | ternary('passed', 'failed')), 'detail': ([((cme_1102_assert_0 is defined and cme_1102_assert_0 is failed) | ternary(cme_1102_assert_0.msg | default(''), '')), ((cme_1102_assert_1 is defined and cme_1102_assert_1 is failed) | ternary(cme_1102_assert_1.msg | default(''), ''))] | reject('equalto', '') | join(' | ') | default('all checks passed'))}] }}"
