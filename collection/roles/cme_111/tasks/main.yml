---
# CME-111: Secure Boot (UEFI)
# Remediation strategy: generic (review and customize for your environment)
# Verification method: Check UEFI Secure Boot state

- name: "CME-111 | Remediation requires environment-specific configuration"
  ansible.builtin.debug:
    msg: >-
      CME-111 (Secure Boot (UEFI)) remediation depends on your
      environment configuration. Override this role's tasks/main.yml
      with site-specific remediation steps.
  when: not (cme_111_custom_remediation | default(false))

- name: "CME-111 | Verify current state"
  ansible.builtin.include_tasks: verify.yml
