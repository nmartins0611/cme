---
# CME-111: Secure Boot (UEFI)
# Verification: Check UEFI Secure Boot state


- name: "CME-111 | Run verification command (linux)"
  ansible.builtin.shell:
    cmd: "mokutil --sb-state"
  register: cme_111_verify_0
  changed_when: false
  failed_when: false
  when: ansible_os_family != 'Windows'

- name: "CME-111 | Assert control is active (linux)"
  ansible.builtin.assert:
    that:
      - "cme_111_verify_0.stdout is search('SecureBoot enabled')"
    fail_msg: "CME-111 FAILED — expected 'SecureBoot enabled'"
    success_msg: "CME-111 PASSED — Secure Boot (UEFI)"
  ignore_errors: true
  register: cme_111_assert_0
  when: ansible_os_family != 'Windows' and cme_111_verify_0 is not skipped

- name: "CME-111 | Run verification command (windows)"
  ansible.windows.win_shell:
    cmd: "Confirm-SecureBootUEFI"
  register: cme_111_verify_1
  changed_when: false
  failed_when: false
  when: ansible_os_family == 'Windows'

- name: "CME-111 | Assert control is active (windows)"
  ansible.builtin.assert:
    that:
      - "cme_111_verify_1.stdout is search('True')"
    fail_msg: "CME-111 FAILED — expected 'True'"
    success_msg: "CME-111 PASSED — Secure Boot (UEFI)"
  ignore_errors: true
  register: cme_111_assert_1
  when: ansible_os_family == 'Windows' and cme_111_verify_1 is not skipped

- name: "CME-111 | Record result"
  ansible.builtin.set_fact:
    cme_results: "{{ (cme_results | default([])) + [{'cme_id': 'CME-111', 'control_name': 'Secure Boot (UEFI)', 'tactic': 'Harden', 'category': 'Kernel Hardening', 'control_layer': 'OS/Kernel', 'confidence': 'High', 'status': ((((cme_111_assert_0 is not defined or cme_111_assert_0 is not failed) and (cme_111_assert_1 is not defined or cme_111_assert_1 is not failed)) and (cme_111_assert_0 is defined or cme_111_assert_1 is defined)) | ternary('passed', 'failed')), 'detail': ([((cme_111_assert_0 is defined and cme_111_assert_0 is failed) | ternary(cme_111_assert_0.msg | default(''), '')), ((cme_111_assert_1 is defined and cme_111_assert_1 is failed) | ternary(cme_111_assert_1.msg | default(''), ''))] | reject('equalto', '') | join(' | ') | default('all checks passed'))}] }}"
