---
# CME-113: Control Flow Integrity (CFI / Shadow Call Stack)
# Remediation strategy: generic (review and customize for your environment)
# Verification method: Check kernel config for CFI or Shadow Call Stack

- name: "CME-113 | Skip if disabled"
  ansible.builtin.meta: end_role
  when: cme_113_skip | default(false)

- name: "CME-113 | Remediation requires environment-specific configuration"
  ansible.builtin.debug:
    msg: >-
      CME-113 (Control Flow Integrity (CFI / Shadow Call Stack)) remediation depends on your
      environment configuration. Override this role's tasks/main.yml
      with site-specific remediation steps.
  when: not (cme_113_custom_remediation | default(false))

- name: "CME-113 | Verify current state"
  ansible.builtin.include_tasks: verify.yml
