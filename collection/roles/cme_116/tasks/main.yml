---
# CME-116: FORTIFY_SOURCE (Buffer Overflow Detection)
# Remediation strategy: generic (review and customize for your environment)
# Verification method: Check that system packages are compiled with _FORTIFY_SOURCE=2 or higher


- name: "CME-116 | Remediation requires environment-specific configuration"
  ansible.builtin.debug:
    msg: >-
      CME-116 (FORTIFY_SOURCE (Buffer Overflow Detection)) remediation depends on your
      environment configuration. Override this role's tasks/main.yml
      with site-specific remediation steps.
  when: not (cme_116_custom_remediation | default(false))

- name: "CME-116 | Verify current state"
  ansible.builtin.include_tasks: verify.yml
