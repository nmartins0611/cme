---
# CME-117: Heap Allocator Hardening (glibc Safe-Linking and Metadata Protection)
# Remediation strategy: generic (review and customize for your environment)
# Verification method: Verify glibc version includes safe-linking (2.32+) and tcache key verification; on older systems, verify MALLOC_PERTURB_ is set

- name: "CME-117 | Skip if disabled"
  ansible.builtin.meta: end_role
  when: cme_117_skip | default(false)

- name: "CME-117 | Remediation requires environment-specific configuration"
  ansible.builtin.debug:
    msg: >-
      CME-117 (Heap Allocator Hardening (glibc Safe-Linking and Metadata Protection)) remediation depends on your
      environment configuration. Override this role's tasks/main.yml
      with site-specific remediation steps.
  when: not (cme_117_custom_remediation | default(false))

- name: "CME-117 | Verify current state"
  ansible.builtin.include_tasks: verify.yml
