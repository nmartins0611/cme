---
# CME-117: Heap Allocator Hardening (glibc Safe-Linking and Metadata Protection)
# Verification: Verify glibc version includes safe-linking (2.32+) and tcache key verification; on older systems, verify MALLOC_PERTURB_ is set

- name: "CME-117 | Skip if disabled"
  ansible.builtin.meta: end_role
  when: cme_117_skip | default(false)

- name: "CME-117 | Run verification command (rhel)"
  ansible.builtin.shell:
    cmd: "rpm -q glibc"
  register: cme_117_verify_0
  changed_when: false
  failed_when: false
  when: ansible_os_family == 'RedHat'

- name: "CME-117 | Assert control is active (rhel)"
  ansible.builtin.assert:
    that:
      - "cme_117_verify_0.stdout is search('glibc-2.32 or higher for safe-linking and tcache key verification [(]RHEL 9+[)]')"
    fail_msg: "CME-117 FAILED — expected 'glibc-2.32 or higher for safe-linking and tcache key verification (RHEL 9+)'"
    success_msg: "CME-117 PASSED — Heap Allocator Hardening (glibc Safe-Linking and Metadata Protection)"
  ignore_errors: true
  register: cme_117_assert_0
  when: ansible_os_family == 'RedHat' and cme_117_verify_0 is not skipped

- name: "CME-117 | Run verification command (linux)"
  ansible.builtin.shell:
    cmd: "ldd --version 2>&1 | head -1"
  register: cme_117_verify_1
  changed_when: false
  failed_when: false
  when: ansible_os_family != 'Windows'

- name: "CME-117 | Assert control is active (linux)"
  ansible.builtin.assert:
    that:
      - "cme_117_verify_1.stdout is search('ldd [(]GNU libc[)] 2.32 or higher')"
    fail_msg: "CME-117 FAILED — expected 'ldd (GNU libc) 2.32 or higher'"
    success_msg: "CME-117 PASSED — Heap Allocator Hardening (glibc Safe-Linking and Metadata Protection)"
  ignore_errors: true
  register: cme_117_assert_1
  when: ansible_os_family != 'Windows' and cme_117_verify_1 is not skipped

- name: "CME-117 | Run verification command (rhel)"
  ansible.builtin.shell:
    cmd: "grep -s MALLOC_PERTURB_ /etc/environment /etc/profile.d/*.sh"
  register: cme_117_verify_2
  changed_when: false
  failed_when: false
  when: ansible_os_family == 'RedHat'

- name: "CME-117 | Assert control is active (rhel)"
  ansible.builtin.assert:
    that:
      - "cme_117_verify_2.stdout is search('MALLOC_PERTURB_ set to nonzero value [(]fallback for glibc < 2.32[)]')"
    fail_msg: "CME-117 FAILED — expected 'MALLOC_PERTURB_ set to nonzero value (fallback for glibc < 2.32)'"
    success_msg: "CME-117 PASSED — Heap Allocator Hardening (glibc Safe-Linking and Metadata Protection)"
  ignore_errors: true
  register: cme_117_assert_2
  when: ansible_os_family == 'RedHat' and cme_117_verify_2 is not skipped

- name: "CME-117 | Record result"
  ansible.builtin.set_fact:
    cme_results: "{{ (cme_results | default([])) + [{'cme_id': 'CME-117', 'control_name': 'Heap Allocator Hardening (glibc Safe-Linking and Metadata Protection)', 'tactic': 'Harden', 'category': 'Kernel Hardening', 'control_layer': 'OS/Kernel', 'confidence': 'High', 'status': ((((cme_117_assert_0 is not defined or cme_117_assert_0 is not failed) and (cme_117_assert_1 is not defined or cme_117_assert_1 is not failed) and (cme_117_assert_2 is not defined or cme_117_assert_2 is not failed)) and (cme_117_assert_0 is defined or cme_117_assert_1 is defined or cme_117_assert_2 is defined)) | ternary('passed', 'failed')), 'detail': ([((cme_117_assert_0 is defined and cme_117_assert_0 is failed) | ternary(cme_117_assert_0.msg | default(''), '')), ((cme_117_assert_1 is defined and cme_117_assert_1 is failed) | ternary(cme_117_assert_1.msg | default(''), '')), ((cme_117_assert_2 is defined and cme_117_assert_2 is failed) | ternary(cme_117_assert_2.msg | default(''), ''))] | reject('equalto', '') | join(' | ') | default('all checks passed'))}] }}"
