cme_cvss_vector_impacts: [{"metric": "AC", "from": "L", "to": "H", "rationale": "The most common filesystem TOCTOU and symlink following pattern \u2014 symlink or hardlink swap in a sticky world-writable directory like /tmp between a privileged process check and use \u2014 is blocked at the kernel level. The attacker must find a TOCTOU target outside of protected directories, exploit a race that does not involve filesystem links, or resort to more complex techniques such as procfs-based redirects. This significantly increases the complexity required for successful exploitation."}]
