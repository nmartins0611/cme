---
# CME-1301: Path Traversal Prevention (Canonicalization)
# This control requires manual/context-specific remediation.
# Running verification only.

- name: "CME-1301 | Skip if disabled"
  ansible.builtin.meta: end_role
  when: cme_1301_skip | default(false)

- name: "CME-1301 | Set manual remediation required"
  ansible.builtin.set_fact:
    cme_1301_manual_remediation_required: true

- name: "CME-1301 | Run verification"
  ansible.builtin.include_tasks: verify.yml
