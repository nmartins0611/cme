---
# CME-1301: Path Traversal Prevention (Canonicalization)
# Verification: Test application with path traversal payloads and verify rejection; inspect source for canonicalization before file access


- name: "CME-1301 | Run verification command (any)"
  ansible.builtin.shell:
    cmd: "grep -rn 'os.path.realpath\\|pathlib.*resolve\\|os.path.abspath' <app_source>/"
  register: cme_1301_verify_0
  changed_when: false
  failed_when: false

- name: "CME-1301 | Assert control is active (any)"
  ansible.builtin.assert:
    that:
      - "cme_1301_verify_0.stdout is search('Path canonicalization calls present before file operations')"
    fail_msg: "CME-1301 FAILED — expected 'Path canonicalization calls present before file operations'"
    success_msg: "CME-1301 PASSED — Path Traversal Prevention (Canonicalization)"
  ignore_errors: true
  register: cme_1301_assert_0
  when: cme_1301_verify_0 is not skipped

- name: "CME-1301 | Run verification command (any)"
  ansible.builtin.shell:
    cmd: "grep -rn 'startswith\\|is_relative_to' <app_source>/"
  register: cme_1301_verify_1
  changed_when: false
  failed_when: false

- name: "CME-1301 | Assert control is active (any)"
  ansible.builtin.assert:
    that:
      - "cme_1301_verify_1.stdout is search('Base directory prefix check present after canonicalization')"
    fail_msg: "CME-1301 FAILED — expected 'Base directory prefix check present after canonicalization'"
    success_msg: "CME-1301 PASSED — Path Traversal Prevention (Canonicalization)"
  ignore_errors: true
  register: cme_1301_assert_1
  when: cme_1301_verify_1 is not skipped

- name: "CME-1301 | Record result"
  ansible.builtin.set_fact:
    cme_results: "{{ (cme_results | default([])) + [{'cme_id': 'CME-1301', 'control_name': 'Path Traversal Prevention (Canonicalization)', 'tactic': 'Harden', 'category': 'Application Input Validation', 'control_layer': 'Application', 'confidence': 'High', 'status': ((((cme_1301_assert_0 is not defined or cme_1301_assert_0 is not failed) and (cme_1301_assert_1 is not defined or cme_1301_assert_1 is not failed)) and (cme_1301_assert_0 is defined or cme_1301_assert_1 is defined)) | ternary('passed', 'failed')), 'detail': ([((cme_1301_assert_0 is defined and cme_1301_assert_0 is failed) | ternary(cme_1301_assert_0.msg | default(''), '')), ((cme_1301_assert_1 is defined and cme_1301_assert_1 is failed) | ternary(cme_1301_assert_1.msg | default(''), ''))] | reject('equalto', '') | join(' | ') | default('all checks passed'))}] }}"
