---
# CME-1303: Application-Level Filesystem Access Confinement
# This control requires manual/context-specific remediation.
# Running verification only.

- name: "CME-1303 | Skip if disabled"
  ansible.builtin.meta: end_role
  when: cme_1303_skip | default(false)

- name: "CME-1303 | Set manual remediation required"
  ansible.builtin.set_fact:
    cme_1303_manual_remediation_required: true

- name: "CME-1303 | Run verification"
  ansible.builtin.include_tasks: verify.yml
