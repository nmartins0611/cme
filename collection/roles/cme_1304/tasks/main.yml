---
# CME-1304: SSRF Prevention (Outbound Request Allowlist)
# This control requires manual/context-specific remediation.
# Running verification only.

- name: "CME-1304 | Skip if disabled"
  ansible.builtin.meta: end_role
  when: cme_1304_skip | default(false)

- name: "CME-1304 | Set manual remediation required"
  ansible.builtin.set_fact:
    cme_1304_manual_remediation_required: true

- name: "CME-1304 | Run verification"
  ansible.builtin.include_tasks: verify.yml
