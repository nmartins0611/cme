---
# CME-1304: SSRF Prevention (Outbound Request Allowlist)
# Verification: Test application with SSRF payloads targeting internal endpoints


- name: "CME-1304 | Run verification command"
  ansible.builtin.shell:
    cmd: "curl -s http://app/fetch?url=http://169.254.169.254/latest/meta-data/ -o /dev/null -w '%{http_code}'"
  register: cme_1304_verify_0
  changed_when: false
  failed_when: false

- name: "CME-1304 | Assert control is active"
  ansible.builtin.assert:
    that:
      - "cme_1304_verify_0.stdout is search('400 or 403')"
    fail_msg: "CME-1304 FAILED — expected '400 or 403'"
    success_msg: "CME-1304 PASSED — SSRF Prevention (Outbound Request Allowlist)"
  ignore_errors: true
  register: cme_1304_assert_0
  when: cme_1304_verify_0 is not skipped

- name: "CME-1304 | Record result"
  ansible.builtin.set_fact:
    cme_results: "{{ (cme_results | default([])) + [{'cme_id': 'CME-1304', 'control_name': 'SSRF Prevention (Outbound Request Allowlist)', 'tactic': 'Harden', 'category': 'Application Input Validation', 'control_layer': 'Application', 'confidence': 'Medium', 'status': ((cme_1304_assert_0 is defined and cme_1304_assert_0 is not failed) | ternary('passed', 'failed')), 'detail': ((cme_1304_assert_0 is defined) | ternary(cme_1304_assert_0.msg | default(''), 'not checked'))}] }}"
