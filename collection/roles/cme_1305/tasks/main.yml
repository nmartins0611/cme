---
# CME-1305: SQL Injection Prevention (Parameterized Queries)
# This control requires manual/context-specific remediation.
# Running verification only.

- name: "CME-1305 | Skip if disabled"
  ansible.builtin.meta: end_role
  when: cme_1305_skip | default(false)

- name: "CME-1305 | Set manual remediation required"
  ansible.builtin.set_fact:
    cme_1305_manual_remediation_required: true

- name: "CME-1305 | Run verification"
  ansible.builtin.include_tasks: verify.yml
