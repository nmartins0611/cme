---
# CME-1306: XSS Prevention (Context-Aware Output Encoding)
# Verification: Verify template engine auto-escaping is enabled and no raw/safe bypasses for user-controlled data

- name: "CME-1306 | Run verification command"
  ansible.builtin.shell:
    cmd: "grep -rn 'autoescape\\|AUTOESCAPE' <app_source>/"
  register: cme_1306_verify_0
  changed_when: false
  failed_when: false

- name: "CME-1306 | Assert control is active"
  ansible.builtin.assert:
    that:
      - "cme_1306_verify_0.stdout is search('Auto-escaping enabled in template config')"
    fail_msg: "CME-1306 FAILED — expected 'Auto-escaping enabled in template config'"
    success_msg: "CME-1306 PASSED — XSS Prevention (Context-Aware Output Encoding)"
  ignore_errors: true
  register: cme_1306_assert_0
  when: cme_1306_verify_0 is not skipped

- name: "CME-1306 | Record result"
  ansible.builtin.set_fact:
    cme_results: "{{ (cme_results | default([])) + [{'cme_id': 'CME-1306', 'control_name': 'XSS Prevention (Context-Aware Output Encoding)', 'tactic': 'Harden', 'category': 'Application Input Validation', 'control_layer': 'Application', 'confidence': 'High', 'status': ((cme_1306_assert_0 is defined and cme_1306_assert_0 is not failed) | ternary('passed', 'failed')), 'detail': ((cme_1306_assert_0 is defined) | ternary(cme_1306_assert_0.msg | default(''), 'not checked'))}] }}"
