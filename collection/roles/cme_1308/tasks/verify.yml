---
# CME-1308: Origin and CORS Validation Enforcement
# Verification: Check that CORS headers do not allow wildcard origins

- name: "CME-1308 | Skip if disabled"
  ansible.builtin.meta: end_role
  when: cme_1308_skip | default(false)

- name: "CME-1308 | Run verification command"
  ansible.builtin.shell:
    cmd: "curl -s -H 'Origin: https://evil.example.com' -I http://localhost:8080 | grep -i access-control-allow-origin"
  register: cme_1308_verify_0
  changed_when: false
  failed_when: false

- name: "CME-1308 | Assert control is active"
  ansible.builtin.assert:
    that:
      - "cme_1308_verify_0.stdout is search('Should not contain * or evil.example.com')"
    fail_msg: "CME-1308 FAILED — expected 'Should not contain * or evil.example.com'"
    success_msg: "CME-1308 PASSED — Origin and CORS Validation Enforcement"
  ignore_errors: true
  register: cme_1308_assert_0
  when: cme_1308_verify_0 is not skipped

- name: "CME-1308 | Record result"
  ansible.builtin.set_fact:
    cme_results: "{{ (cme_results | default([])) + [{'cme_id': 'CME-1308', 'control_name': 'Origin and CORS Validation Enforcement', 'tactic': 'Harden', 'category': 'Application Input Validation', 'control_layer': 'Application', 'confidence': 'High', 'status': ((cme_1308_assert_0 is defined and cme_1308_assert_0 is not failed) | ternary('passed', 'failed')), 'detail': ((cme_1308_assert_0 is defined) | ternary(cme_1308_assert_0.msg | default(''), 'not checked'))}] }}"
