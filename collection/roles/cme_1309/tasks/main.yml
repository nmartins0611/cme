---
# CME-1309: Script Engine Restriction (Sandbox / Disable)
# This control requires manual/context-specific remediation.
# Running verification only.

- name: "CME-1309 | Skip if disabled"
  ansible.builtin.meta: end_role
  when: cme_1309_skip | default(false)

- name: "CME-1309 | Set manual remediation required"
  ansible.builtin.set_fact:
    cme_1309_manual_remediation_required: true

- name: "CME-1309 | Run verification"
  ansible.builtin.include_tasks: verify.yml
