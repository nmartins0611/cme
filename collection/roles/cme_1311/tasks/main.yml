---
# CME-1311: Input Size and Quantity Bounds Enforcement
# This control requires manual/context-specific remediation.
# Running verification only.

- name: "CME-1311 | Skip if disabled"
  ansible.builtin.meta: end_role
  when: cme_1311_skip | default(false)

- name: "CME-1311 | Set manual remediation required"
  ansible.builtin.set_fact:
    cme_1311_manual_remediation_required: true

- name: "CME-1311 | Run verification"
  ansible.builtin.include_tasks: verify.yml
