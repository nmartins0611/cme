---
# CME-1313: CRLF / Line Injection Prevention (Newline Sanitization for Structured Formats)
# This control requires manual/context-specific remediation.
# Running verification only.

- name: "CME-1313 | Skip if disabled"
  ansible.builtin.meta: end_role
  when: cme_1313_skip | default(false)

- name: "CME-1313 | Set manual remediation required"
  ansible.builtin.set_fact:
    cme_1313_manual_remediation_required: true

- name: "CME-1313 | Run verification"
  ansible.builtin.include_tasks: verify.yml
