---
# CME-1313: CRLF / Line Injection Prevention (Newline Sanitization for Structured Formats)
# Verification: Verify that input handling code strips or rejects CR/LF characters before constructing multi-line format outputs


- name: "CME-1313 | Run verification command (any)"
  ansible.builtin.shell:
    cmd: "grep -rn 'replace.*\\\\r\\|replace.*\\\\n\\|strip.*newline\\|reject.*newline\\|CRLF' <app_source>/"
  register: cme_1313_verify_0
  changed_when: false
  failed_when: false

- name: "CME-1313 | Assert control is active (any)"
  ansible.builtin.assert:
    that:
      - "cme_1313_verify_0.stdout is search('Newline sanitization present in input handling paths that feed into structured text formats')"
    fail_msg: "CME-1313 FAILED — expected 'Newline sanitization present in input handling paths that feed into structured text formats'"
    success_msg: "CME-1313 PASSED — CRLF / Line Injection Prevention (Newline Sanitization for Structured Formats)"
  ignore_errors: true
  register: cme_1313_assert_0
  when: cme_1313_verify_0 is not skipped

- name: "CME-1313 | Run verification command (any)"
  ansible.builtin.shell:
    cmd: "grep -rn 'set-cookie\\|Set-Header\\|add_header\\|setHeader' <app_source>/ | head -20"
  register: cme_1313_verify_1
  changed_when: false
  failed_when: false

- name: "CME-1313 | Assert control is active (any)"
  ansible.builtin.assert:
    that:
      - "cme_1313_verify_1.stdout is search('Header-setting code validates input values do not contain CR/LF')"
    fail_msg: "CME-1313 FAILED — expected 'Header-setting code validates input values do not contain CR/LF'"
    success_msg: "CME-1313 PASSED — CRLF / Line Injection Prevention (Newline Sanitization for Structured Formats)"
  ignore_errors: true
  register: cme_1313_assert_1
  when: cme_1313_verify_1 is not skipped

- name: "CME-1313 | Record result"
  ansible.builtin.set_fact:
    cme_results: "{{ (cme_results | default([])) + [{'cme_id': 'CME-1313', 'control_name': 'CRLF / Line Injection Prevention (Newline Sanitization for Structured Formats)', 'tactic': 'Harden', 'category': 'Application Input Validation', 'control_layer': 'Application', 'confidence': 'High', 'status': ((((cme_1313_assert_0 is not defined or cme_1313_assert_0 is not failed) and (cme_1313_assert_1 is not defined or cme_1313_assert_1 is not failed)) and (cme_1313_assert_0 is defined or cme_1313_assert_1 is defined)) | ternary('passed', 'failed')), 'detail': ([((cme_1313_assert_0 is defined and cme_1313_assert_0 is failed) | ternary(cme_1313_assert_0.msg | default(''), '')), ((cme_1313_assert_1 is defined and cme_1313_assert_1 is failed) | ternary(cme_1313_assert_1.msg | default(''), ''))] | reject('equalto', '') | join(' | ') | default('all checks passed'))}] }}"
