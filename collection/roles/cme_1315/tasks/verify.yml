---
# CME-1315: Allowlist-Preferred Input Validation (Deny-by-Default Filtering)
# Verification: Review application source code and configuration to verify that security-sensitive input validation uses explicit allowlists with default-deny semantics rather than denylists with default-permit. Check SSRF filters, deserialization type validators, sandbox capability lists, and application security policy files.

- name: "CME-1315 | Skip if disabled"
  ansible.builtin.meta: end_role
  when: cme_1315_skip | default(false)

- name: "CME-1315 | Run verification command (any)"
  ansible.builtin.shell:
    cmd: "grep -rn 'allowlist\\|whitelist\\|permitted\\|allowed_types\\|SAFE_' <app_source>/ | head -20"
  register: cme_1315_verify_0
  changed_when: false
  failed_when: false

- name: "CME-1315 | Assert control is active (any)"
  ansible.builtin.assert:
    that:
      - "cme_1315_verify_0.stdout is search('Security validation uses allowlist patterns [(]explicit permit with default deny[)]')"
    fail_msg: "CME-1315 FAILED — expected 'Security validation uses allowlist patterns (explicit permit with default deny)'"
    success_msg: "CME-1315 PASSED — Allowlist-Preferred Input Validation (Deny-by-Default Filtering)"
  ignore_errors: true
  register: cme_1315_assert_0
  when: cme_1315_verify_0 is not skipped

- name: "CME-1315 | Run verification command (any)"
  ansible.builtin.shell:
    cmd: "grep -rn 'blocklist\\|blacklist\\|denylist\\|BLOCKED_\\|UNSAFE_\\|DANGEROUS_' <app_source>/ | head -20"
  register: cme_1315_verify_1
  changed_when: false
  failed_when: false

- name: "CME-1315 | Assert control is active (any)"
  ansible.builtin.assert:
    that:
      - "cme_1315_verify_1.stdout is search('Denylist patterns should be supplementary to allowlists, not the sole validation mechanism')"
    fail_msg: "CME-1315 FAILED — expected 'Denylist patterns should be supplementary to allowlists, not the sole validation mechanism'"
    success_msg: "CME-1315 PASSED — Allowlist-Preferred Input Validation (Deny-by-Default Filtering)"
  ignore_errors: true
  register: cme_1315_assert_1
  when: cme_1315_verify_1 is not skipped

- name: "CME-1315 | Record result"
  ansible.builtin.set_fact:
    cme_results: "{{ (cme_results | default([])) + [{'cme_id': 'CME-1315', 'control_name': 'Allowlist-Preferred Input Validation (Deny-by-Default Filtering)', 'tactic': 'Harden', 'category': 'Application Input Validation', 'control_layer': 'Application', 'confidence': 'High', 'status': ((((cme_1315_assert_0 is not defined or cme_1315_assert_0 is not failed) and (cme_1315_assert_1 is not defined or cme_1315_assert_1 is not failed)) and (cme_1315_assert_0 is defined or cme_1315_assert_1 is defined)) | ternary('passed', 'failed')), 'detail': ([((cme_1315_assert_0 is defined and cme_1315_assert_0 is failed) | ternary(cme_1315_assert_0.msg | default(''), '')), ((cme_1315_assert_1 is defined and cme_1315_assert_1 is failed) | ternary(cme_1315_assert_1.msg | default(''), ''))] | reject('equalto', '') | join(' | ') | default('all checks passed'))}] }}"
