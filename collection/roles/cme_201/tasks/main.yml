---
# CME-201: Zero Trust Gateway / Identity-Aware Proxy
# This control requires manual/context-specific remediation.
# Running verification only.

- name: "CME-201 | Skip if disabled"
  ansible.builtin.meta: end_role
  when: cme_201_skip | default(false)

- name: "CME-201 | Set manual remediation required"
  ansible.builtin.set_fact:
    cme_201_manual_remediation_required: true

- name: "CME-201 | Run verification"
  ansible.builtin.include_tasks: verify.yml
