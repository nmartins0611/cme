---
# CME-202: Host-Based Firewall (firewalld/nftables)
# This control requires manual/context-specific remediation.
# Running verification only.

- name: "CME-202 | Skip if disabled"
  ansible.builtin.meta: end_role
  when: cme_202_skip | default(false)

- name: "CME-202 | Set manual remediation required"
  ansible.builtin.set_fact:
    cme_202_manual_remediation_required: true

- name: "CME-202 | Run verification"
  ansible.builtin.include_tasks: verify.yml
