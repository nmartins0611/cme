---
# CME-202: Host-Based Firewall (firewalld/nftables)
# Verification: Verify firewalld is running with restrictive zone

- name: "CME-202 | Run verification command (rhel)"
  ansible.builtin.shell:
    cmd: "firewall-cmd --state"
  register: cme_202_verify_0
  changed_when: false
  failed_when: false
  when: ansible_os_family == 'RedHat'

- name: "CME-202 | Assert control is active (rhel)"
  ansible.builtin.assert:
    that:
      - "cme_202_verify_0.stdout is search('running')"
    fail_msg: "CME-202 FAILED — expected 'running'"
    success_msg: "CME-202 PASSED — Host-Based Firewall (firewalld/nftables)"
  ignore_errors: true
  register: cme_202_assert_0
  when: ansible_os_family == 'RedHat' and cme_202_verify_0 is not skipped

- name: "CME-202 | Run verification command (rhel)"
  ansible.builtin.shell:
    cmd: "firewall-cmd --get-active-zones"
  register: cme_202_verify_1
  changed_when: false
  failed_when: false
  when: ansible_os_family == 'RedHat'

- name: "CME-202 | Assert control is active (rhel)"
  ansible.builtin.assert:
    that:
      - "cme_202_verify_1.stdout is search('public')"
    fail_msg: "CME-202 FAILED — expected 'public'"
    success_msg: "CME-202 PASSED — Host-Based Firewall (firewalld/nftables)"
  ignore_errors: true
  register: cme_202_assert_1
  when: ansible_os_family == 'RedHat' and cme_202_verify_1 is not skipped

- name: "CME-202 | Run verification command (linux)"
  ansible.builtin.shell:
    cmd: "nft list ruleset | head -20"
  register: cme_202_verify_2
  changed_when: false
  failed_when: false
  when: ansible_os_family != 'Windows'

- name: "CME-202 | Assert control is active (linux)"
  ansible.builtin.assert:
    that:
      - "cme_202_verify_2.stdout is search('table')"
    fail_msg: "CME-202 FAILED — expected 'table'"
    success_msg: "CME-202 PASSED — Host-Based Firewall (firewalld/nftables)"
  ignore_errors: true
  register: cme_202_assert_2
  when: ansible_os_family != 'Windows' and cme_202_verify_2 is not skipped

- name: "CME-202 | Record result"
  ansible.builtin.set_fact:
    cme_results: "{{ (cme_results | default([])) + [{'cme_id': 'CME-202', 'control_name': 'Host-Based Firewall (firewalld/nftables)', 'tactic': 'Isolate', 'category': 'Network Isolation', 'control_layer': 'Network', 'confidence': 'High', 'status': ((cme_202_assert_0 is defined and cme_202_assert_0 is not failed) | ternary('passed', 'failed')), 'detail': ((cme_202_assert_0 is defined) | ternary(cme_202_assert_0.msg | default(''), 'not checked'))}] }}"
