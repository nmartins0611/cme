---
# CME-203: Network Segmentation (VLANs/Subnets)
# Verification: Verify network topology shows segmentation between trust zones


- name: "CME-203 | Run verification command"
  ansible.builtin.shell:
    cmd: "ip addr show | grep -c 'inet '"
  register: cme_203_verify_0
  changed_when: false
  failed_when: false
  when: ansible_os_family != 'Windows'

- name: "CME-203 | Assert control is active"
  ansible.builtin.assert:
    that:
      - "cme_203_verify_0.stdout is search('Multiple interfaces or VLANs')"
    fail_msg: "CME-203 FAILED — expected 'Multiple interfaces or VLANs'"
    success_msg: "CME-203 PASSED — Network Segmentation (VLANs/Subnets)"
  ignore_errors: true
  register: cme_203_assert_0
  when: ansible_os_family != 'Windows' and cme_203_verify_0 is not skipped

- name: "CME-203 | Record result"
  ansible.builtin.set_fact:
    cme_results: "{{ (cme_results | default([])) + [{'cme_id': 'CME-203', 'control_name': 'Network Segmentation (VLANs/Subnets)', 'tactic': 'Isolate', 'category': 'Network Isolation', 'control_layer': 'Network', 'confidence': 'High', 'status': ((cme_203_assert_0 is defined and cme_203_assert_0 is not failed) | ternary('passed', 'failed')), 'detail': ((cme_203_assert_0 is defined) | ternary(cme_203_assert_0.msg | default(''), 'not checked'))}] }}"
