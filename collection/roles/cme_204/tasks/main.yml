---
# CME-204: IPsec / WireGuard (Encrypted Transport)
# This control requires manual/context-specific remediation.
# Running verification only.

- name: "CME-204 | Skip if disabled"
  ansible.builtin.meta: end_role
  when: cme_204_skip | default(false)

- name: "CME-204 | Set manual remediation required"
  ansible.builtin.set_fact:
    cme_204_manual_remediation_required: true

- name: "CME-204 | Run verification"
  ansible.builtin.include_tasks: verify.yml
