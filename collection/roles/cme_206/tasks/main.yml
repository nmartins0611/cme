---
# CME-206: Network Policy (Kubernetes)
# This control requires manual/context-specific remediation.
# Running verification only.

- name: "CME-206 | Skip if disabled"
  ansible.builtin.meta: end_role
  when: cme_206_skip | default(false)

- name: "CME-206 | Set manual remediation required"
  ansible.builtin.set_fact:
    cme_206_manual_remediation_required: true

- name: "CME-206 | Run verification"
  ansible.builtin.include_tasks: verify.yml
