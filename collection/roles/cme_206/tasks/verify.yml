---
# CME-206: Network Policy (Kubernetes)
# Verification: Check for default-deny NetworkPolicy in namespace

- name: "CME-206 | Skip if disabled"
  ansible.builtin.meta: end_role
  when: cme_206_skip | default(false)

- name: "CME-206 | Run verification command"
  ansible.builtin.shell:
    cmd: "kubectl get networkpolicy -n <namespace> -o name | head -5"
  register: cme_206_verify_0
  changed_when: false
  failed_when: false
  when: cme_kubernetes_host | default(false)

- name: "CME-206 | Assert control is active"
  ansible.builtin.assert:
    that:
      - "cme_206_verify_0.stdout is search('networkpolicy.networking.k8s.io/default-deny')"
    fail_msg: "CME-206 FAILED — expected 'networkpolicy.networking.k8s.io/default-deny'"
    success_msg: "CME-206 PASSED — Network Policy (Kubernetes)"
  ignore_errors: true
  register: cme_206_assert_0
  when: cme_kubernetes_host | default(false) and cme_206_verify_0 is not skipped

- name: "CME-206 | Record result"
  ansible.builtin.set_fact:
    cme_results: "{{ (cme_results | default([])) + [{'cme_id': 'CME-206', 'control_name': 'Network Policy (Kubernetes)', 'tactic': 'Isolate', 'category': 'Network Isolation', 'control_layer': 'Network', 'confidence': 'High', 'status': ((cme_206_assert_0 is defined and cme_206_assert_0 is not failed) | ternary('passed', 'failed')), 'detail': ((cme_206_assert_0 is defined) | ternary(cme_206_assert_0.msg | default(''), 'not checked'))}] }}"
