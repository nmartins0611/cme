---
# CME-207: DNS Rebinding Protection
# This control requires manual/context-specific remediation.
# Running verification only.

- name: "CME-207 | Skip if disabled"
  ansible.builtin.meta: end_role
  when: cme_207_skip | default(false)

- name: "CME-207 | Set manual remediation required"
  ansible.builtin.set_fact:
    cme_207_manual_remediation_required: true

- name: "CME-207 | Run verification"
  ansible.builtin.include_tasks: verify.yml
