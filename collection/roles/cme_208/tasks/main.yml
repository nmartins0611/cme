---
# CME-208: Outbound Network Egress Restriction (SSRF Blast Radius Containment)
# This control requires manual/context-specific remediation.
# Running verification only.

- name: "CME-208 | Skip if disabled"
  ansible.builtin.meta: end_role
  when: cme_208_skip | default(false)

- name: "CME-208 | Set manual remediation required"
  ansible.builtin.set_fact:
    cme_208_manual_remediation_required: true

- name: "CME-208 | Run verification"
  ansible.builtin.include_tasks: verify.yml
