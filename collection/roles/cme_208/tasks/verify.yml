---
# CME-208: Outbound Network Egress Restriction (SSRF Blast Radius Containment)
# Verification: Verify that application workloads cannot initiate outbound connections to RFC1918 ranges, link-local addresses, or localhost


- name: "CME-208 | Run verification command (linux)"
  ansible.builtin.shell:
    cmd: "nft list ruleset | grep -A5 'chain output' | grep -E '10\\.0\\.0\\.0|172\\.16\\.0\\.0|192\\.168\\.0\\.0|169\\.254'"
  register: cme_208_verify_0
  changed_when: false
  failed_when: false
  when: ansible_os_family != 'Windows'

- name: "CME-208 | Assert control is active (linux)"
  ansible.builtin.assert:
    that:
      - "cme_208_verify_0.stdout is search('Drop/reject rules for RFC1918 and link-local ranges in the output chain')"
    fail_msg: "CME-208 FAILED — expected 'Drop/reject rules for RFC1918 and link-local ranges in the output chain'"
    success_msg: "CME-208 PASSED — Outbound Network Egress Restriction (SSRF Blast Radius Containment)"
  ignore_errors: true
  register: cme_208_assert_0
  when: ansible_os_family != 'Windows' and cme_208_verify_0 is not skipped

- name: "CME-208 | Run verification command (any)"
  ansible.builtin.shell:
    cmd: "kubectl get networkpolicy -n <namespace> -o jsonpath='{.items[*].spec.egress}'"
  register: cme_208_verify_1
  changed_when: false
  failed_when: false

- name: "CME-208 | Assert control is active (any)"
  ansible.builtin.assert:
    that:
      - "cme_208_verify_1.stdout is search('Egress rules present that restrict destination CIDRs to required external endpoints only')"
    fail_msg: "CME-208 FAILED — expected 'Egress rules present that restrict destination CIDRs to required external endpoints only'"
    success_msg: "CME-208 PASSED — Outbound Network Egress Restriction (SSRF Blast Radius Containment)"
  ignore_errors: true
  register: cme_208_assert_1
  when: cme_208_verify_1 is not skipped

- name: "CME-208 | Run verification command (any)"
  ansible.builtin.shell:
    cmd: "curl -s --connect-timeout 3 http://169.254.169.254/latest/meta-data/ -o /dev/null -w '%{http_code}' 2>&1 || echo 'blocked'"
  register: cme_208_verify_2
  changed_when: false
  failed_when: false

- name: "CME-208 | Assert control is active (any)"
  ansible.builtin.assert:
    that:
      - "cme_208_verify_2.stdout is search('Connection refused, timed out, or blocked — cloud metadata endpoint unreachable from application workload')"
    fail_msg: "CME-208 FAILED — expected 'Connection refused, timed out, or blocked — cloud metadata endpoint unreachable from application workload'"
    success_msg: "CME-208 PASSED — Outbound Network Egress Restriction (SSRF Blast Radius Containment)"
  ignore_errors: true
  register: cme_208_assert_2
  when: cme_208_verify_2 is not skipped

- name: "CME-208 | Run verification command (windows)"
  ansible.windows.win_shell:
    cmd: "Get-NetFirewallRule -Direction Outbound | Where-Object { $_.Action -eq 'Block' } | Get-NetFirewallAddressFilter | Where-Object { $_.RemoteAddress -match '10\\.|172\\.16|192\\.168|169\\.254' }"
  register: cme_208_verify_3
  changed_when: false
  failed_when: false
  when: ansible_os_family == 'Windows'

- name: "CME-208 | Assert control is active (windows)"
  ansible.builtin.assert:
    that:
      - "cme_208_verify_3.stdout is search('Outbound block rules present for RFC1918 and link-local ranges')"
    fail_msg: "CME-208 FAILED — expected 'Outbound block rules present for RFC1918 and link-local ranges'"
    success_msg: "CME-208 PASSED — Outbound Network Egress Restriction (SSRF Blast Radius Containment)"
  ignore_errors: true
  register: cme_208_assert_3
  when: ansible_os_family == 'Windows' and cme_208_verify_3 is not skipped

- name: "CME-208 | Record result"
  ansible.builtin.set_fact:
    cme_results: "{{ (cme_results | default([])) + [{'cme_id': 'CME-208', 'control_name': 'Outbound Network Egress Restriction (SSRF Blast Radius Containment)', 'tactic': 'Isolate', 'category': 'Network Isolation', 'control_layer': 'Network', 'confidence': 'High', 'status': ((((cme_208_assert_0 is not defined or cme_208_assert_0 is not failed) and (cme_208_assert_1 is not defined or cme_208_assert_1 is not failed) and (cme_208_assert_2 is not defined or cme_208_assert_2 is not failed) and (cme_208_assert_3 is not defined or cme_208_assert_3 is not failed)) and (cme_208_assert_0 is defined or cme_208_assert_1 is defined or cme_208_assert_2 is defined or cme_208_assert_3 is defined)) | ternary('passed', 'failed')), 'detail': ([((cme_208_assert_0 is defined and cme_208_assert_0 is failed) | ternary(cme_208_assert_0.msg | default(''), '')), ((cme_208_assert_1 is defined and cme_208_assert_1 is failed) | ternary(cme_208_assert_1.msg | default(''), '')), ((cme_208_assert_2 is defined and cme_208_assert_2 is failed) | ternary(cme_208_assert_2.msg | default(''), '')), ((cme_208_assert_3 is defined and cme_208_assert_3 is failed) | ternary(cme_208_assert_3.msg | default(''), ''))] | reject('equalto', '') | join(' | ') | default('all checks passed'))}] }}"
