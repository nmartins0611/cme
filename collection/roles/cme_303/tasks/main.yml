---
# CME-303: SELinux Booleans (Restrictive)

- name: "CME-303 | Skip if disabled"
  ansible.builtin.meta: end_role
  when: cme_303_skip | default(false)

- name: "CME-303 | Ensure SELinux packages are installed"
  ansible.builtin.package:
    name:
      - libselinux
      - policycoreutils
      - selinux-policy-targeted
    state: present
  when: ansible_os_family == 'RedHat'

- name: "CME-303 | Set SELinux to enforcing"
  ansible.posix.selinux:
    policy: targeted
    state: enforcing
  when: ansible_os_family == 'RedHat'

- name: "CME-303 | Verify after remediation"
  ansible.builtin.include_tasks: verify.yml
