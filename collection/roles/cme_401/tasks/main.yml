---
# CME-401: System-wide Crypto Policy (FUTURE)

- name: "CME-401 | Skip if disabled"
  ansible.builtin.meta: end_role
  when: cme_401_skip | default(false)

- name: "CME-401 | Check current crypto policy"
  ansible.builtin.command:
    cmd: update-crypto-policies --show
  register: cme_401_current_policy
  changed_when: false
  when: ansible_os_family == 'RedHat'

- name: "CME-401 | Set system crypto policy"
  ansible.builtin.command:
    cmd: "update-crypto-policies --set {{ cme_401_crypto_policy | default('FUTURE') }}"
  changed_when: true
  when: ansible_os_family == 'RedHat' and (cme_401_current_policy.stdout | default('') | trim) != (cme_401_crypto_policy | default('FUTURE'))

- name: "CME-401 | Verify after remediation"
  ansible.builtin.include_tasks: verify.yml
