---
# CME-401: System-wide Crypto Policy (FUTURE)
# Verification: Check system crypto policy level

- name: "CME-401 | Run verification command"
  ansible.builtin.shell:
    cmd: "update-crypto-policies --show"
  register: cme_401_verify_0
  changed_when: false
  failed_when: false
  when: ansible_os_family == 'RedHat'

- name: "CME-401 | Assert control is active"
  ansible.builtin.assert:
    that:
      - "cme_401_verify_0.stdout is search('FUTURE')"
    fail_msg: "CME-401 FAILED — expected 'FUTURE'"
    success_msg: "CME-401 PASSED — System-wide Crypto Policy (FUTURE)"
  ignore_errors: true
  register: cme_401_assert_0
  when: ansible_os_family == 'RedHat' and cme_401_verify_0 is not skipped

- name: "CME-401 | Record result"
  ansible.builtin.set_fact:
    cme_results: "{{ (cme_results | default([])) + [{'cme_id': 'CME-401', 'control_name': 'System-wide Crypto Policy (FUTURE)', 'tactic': 'Harden', 'category': 'Cryptographic Controls', 'control_layer': 'Application', 'confidence': 'High', 'status': ((cme_401_assert_0 is defined and cme_401_assert_0 is not failed) | ternary('passed', 'failed')), 'detail': ((cme_401_assert_0 is defined) | ternary(cme_401_assert_0.msg | default(''), 'not checked'))}] }}"
