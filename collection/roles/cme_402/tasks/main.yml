---
# CME-402: FIPS 140-3 Mode
# Remediation strategy: generic (review and customize for your environment)
# Verification method: Verify FIPS mode is enabled

- name: "CME-402 | Skip if disabled"
  ansible.builtin.meta: end_role
  when: cme_402_skip | default(false)

- name: "CME-402 | Remediation requires environment-specific configuration"
  ansible.builtin.debug:
    msg: >-
      CME-402 (FIPS 140-3 Mode) remediation depends on your
      environment configuration. Override this role's tasks/main.yml
      with site-specific remediation steps.
  when: not (cme_402_custom_remediation | default(false))

- name: "CME-402 | Verify current state"
  ansible.builtin.include_tasks: verify.yml
