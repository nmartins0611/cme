---
# CME-404: Certificate Pinning
# Remediation strategy: generic (review and customize for your environment)
# Verification method: Application-specific: check for pin configuration in app config or HTTP headers


- name: "CME-404 | Remediation requires environment-specific configuration"
  ansible.builtin.debug:
    msg: >-
      CME-404 (Certificate Pinning) remediation depends on your
      environment configuration. Override this role's tasks/main.yml
      with site-specific remediation steps.
  when: not (cme_404_custom_remediation | default(false))

- name: "CME-404 | Verify current state"
  ansible.builtin.include_tasks: verify.yml
