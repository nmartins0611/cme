---
# CME-405: DNSSEC Validation
# Remediation strategy: generic (review and customize for your environment)
# Verification method: Verify DNSSEC validation is enabled in resolver

- name: "CME-405 | Remediation requires environment-specific configuration"
  ansible.builtin.debug:
    msg: >-
      CME-405 (DNSSEC Validation) remediation depends on your
      environment configuration. Override this role's tasks/main.yml
      with site-specific remediation steps.
  when: not (cme_405_custom_remediation | default(false))

- name: "CME-405 | Verify current state"
  ansible.builtin.include_tasks: verify.yml
