---
# CME-406: Signed Package Enforcement (GPG)
# Remediation strategy: generic (review and customize for your environment)
# Verification method: Verify gpgcheck enabled for all repos


- name: "CME-406 | Remediation requires environment-specific configuration"
  ansible.builtin.debug:
    msg: >-
      CME-406 (Signed Package Enforcement (GPG)) remediation depends on your
      environment configuration. Override this role's tasks/main.yml
      with site-specific remediation steps.
  when: not (cme_406_custom_remediation | default(false))

- name: "CME-406 | Verify current state"
  ansible.builtin.include_tasks: verify.yml
