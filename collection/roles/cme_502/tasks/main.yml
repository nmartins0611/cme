---
# CME-502: noexec on /tmp and /dev/shm
# Remediation strategy: generic (review and customize for your environment)
# Verification method: Check mount options for /tmp and /dev/shm

- name: "CME-502 | Remediation requires environment-specific configuration"
  ansible.builtin.debug:
    msg: >-
      CME-502 (noexec on /tmp and /dev/shm) remediation depends on your
      environment configuration. Override this role's tasks/main.yml
      with site-specific remediation steps.
  when: not (cme_502_custom_remediation | default(false))

- name: "CME-502 | Verify current state"
  ansible.builtin.include_tasks: verify.yml
