---
# CME-502: noexec on /tmp and /dev/shm


- name: "CME-502 | Ensure /tmp is mounted with noexec"
  ansible.posix.mount:
    path: /tmp
    src: "{{ ansible_mounts | selectattr('mount', 'equalto', '/tmp') | map(attribute='device') | first | default('tmpfs') }}"
    fstype: "{{ ansible_mounts | selectattr('mount', 'equalto', '/tmp') | map(attribute='fstype') | first | default('tmpfs') }}"
    opts: "defaults,noexec"
    state: mounted
  when: ansible_os_family != 'Windows'

- name: "CME-502 | Ensure /dev/shm is mounted with noexec"
  ansible.posix.mount:
    path: /dev/shm
    src: "{{ ansible_mounts | selectattr('mount', 'equalto', '/dev/shm') | map(attribute='device') | first | default('tmpfs') }}"
    fstype: "{{ ansible_mounts | selectattr('mount', 'equalto', '/dev/shm') | map(attribute='fstype') | first | default('tmpfs') }}"
    opts: "defaults,noexec"
    state: mounted
  when: ansible_os_family != 'Windows'

- name: "CME-502 | Verify after remediation"
  ansible.builtin.include_tasks: verify.yml
