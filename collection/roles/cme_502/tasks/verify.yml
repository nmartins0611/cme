---
# CME-502: noexec on /tmp and /dev/shm
# Verification: Check mount options for /tmp and /dev/shm


- name: "CME-502 | Run verification command (linux)"
  ansible.builtin.shell:
    cmd: "mount | grep '/tmp' | grep noexec"
  register: cme_502_verify_0
  changed_when: false
  failed_when: false
  when: ansible_os_family != 'Windows'

- name: "CME-502 | Assert control is active (linux)"
  ansible.builtin.assert:
    that:
      - "cme_502_verify_0.stdout is search('noexec')"
    fail_msg: "CME-502 FAILED — expected 'noexec'"
    success_msg: "CME-502 PASSED — noexec on /tmp and /dev/shm"
  ignore_errors: true
  register: cme_502_assert_0
  when: ansible_os_family != 'Windows' and cme_502_verify_0 is not skipped

- name: "CME-502 | Run verification command (linux)"
  ansible.builtin.shell:
    cmd: "mount | grep '/dev/shm' | grep noexec"
  register: cme_502_verify_1
  changed_when: false
  failed_when: false
  when: ansible_os_family != 'Windows'

- name: "CME-502 | Assert control is active (linux)"
  ansible.builtin.assert:
    that:
      - "cme_502_verify_1.stdout is search('noexec')"
    fail_msg: "CME-502 FAILED — expected 'noexec'"
    success_msg: "CME-502 PASSED — noexec on /tmp and /dev/shm"
  ignore_errors: true
  register: cme_502_assert_1
  when: ansible_os_family != 'Windows' and cme_502_verify_1 is not skipped

- name: "CME-502 | Record result"
  ansible.builtin.set_fact:
    cme_results: "{{ (cme_results | default([])) + [{'cme_id': 'CME-502', 'control_name': 'noexec on /tmp and /dev/shm', 'tactic': 'Harden', 'category': 'Filesystem Hardening', 'control_layer': 'OS/Kernel', 'confidence': 'High', 'status': ((((cme_502_assert_0 is not defined or cme_502_assert_0 is not failed) and (cme_502_assert_1 is not defined or cme_502_assert_1 is not failed)) and (cme_502_assert_0 is defined or cme_502_assert_1 is defined)) | ternary('passed', 'failed')), 'detail': ([((cme_502_assert_0 is defined and cme_502_assert_0 is failed) | ternary(cme_502_assert_0.msg | default(''), '')), ((cme_502_assert_1 is defined and cme_502_assert_1 is failed) | ternary(cme_502_assert_1.msg | default(''), ''))] | reject('equalto', '') | join(' | ') | default('all checks passed'))}] }}"
