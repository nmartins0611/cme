    msg: >-
      CME-503 (nosuid on Non-Root Partitions) remediation depends on your
      environment configuration. Override this role's tasks/main.yml
      with site-specific remediation steps.
  when: not (cme_503_custom_remediation | default(false))

- name: "CME-503 | Verify current state"
  ansible.builtin.include_tasks: verify.yml
