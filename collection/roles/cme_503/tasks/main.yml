---
# CME-503: nosuid on Non-Root Partitions


- name: "CME-503 | Ensure /tmp is mounted with nosuid"
  ansible.posix.mount:
    path: /tmp
    src: "{{ ansible_mounts | selectattr('mount', 'equalto', '/tmp') | map(attribute='device') | first | default('tmpfs') }}"
    fstype: "{{ ansible_mounts | selectattr('mount', 'equalto', '/tmp') | map(attribute='fstype') | first | default('tmpfs') }}"
    opts: "defaults,nosuid"
    state: mounted
  when: ansible_os_family != 'Windows'

- name: "CME-503 | Ensure /home is mounted with nosuid"
  ansible.posix.mount:
    path: /home
    src: "{{ ansible_mounts | selectattr('mount', 'equalto', '/home') | map(attribute='device') | first | default('tmpfs') }}"
    fstype: "{{ ansible_mounts | selectattr('mount', 'equalto', '/home') | map(attribute='fstype') | first | default('tmpfs') }}"
    opts: "defaults,nosuid"
    state: mounted
  when: ansible_os_family != 'Windows'

- name: "CME-503 | Verify after remediation"
  ansible.builtin.include_tasks: verify.yml
