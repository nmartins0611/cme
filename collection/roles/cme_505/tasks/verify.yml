---
# CME-505: IMA/EVM (Integrity Measurement Architecture)
# Verification: Check IMA policy is loaded and enforcing


- name: "CME-505 | Run verification command"
  ansible.builtin.shell:
    cmd: "cat /sys/kernel/security/ima/policy | head -5"
  register: cme_505_verify_0
  changed_when: false
  failed_when: false
  when: ansible_os_family != 'Windows'

- name: "CME-505 | Assert control is active"
  ansible.builtin.assert:
    that:
      - "cme_505_verify_0.stdout is search('appraise')"
    fail_msg: "CME-505 FAILED — expected 'appraise'"
    success_msg: "CME-505 PASSED — IMA/EVM (Integrity Measurement Architecture)"
  ignore_errors: true
  register: cme_505_assert_0
  when: ansible_os_family != 'Windows' and cme_505_verify_0 is not skipped

- name: "CME-505 | Record result"
  ansible.builtin.set_fact:
    cme_results: "{{ (cme_results | default([])) + [{'cme_id': 'CME-505', 'control_name': 'IMA/EVM (Integrity Measurement Architecture)', 'tactic': 'Harden', 'category': 'Filesystem Hardening', 'control_layer': 'OS/Kernel', 'confidence': 'Medium', 'status': ((cme_505_assert_0 is defined and cme_505_assert_0 is not failed) | ternary('passed', 'failed')), 'detail': ((cme_505_assert_0 is defined) | ternary(cme_505_assert_0.msg | default(''), 'not checked'))}] }}"
