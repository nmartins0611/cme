---
# CME-507: Secure Dynamic Linker Configuration (LD_PRELOAD/PATH Hardening)
# Remediation strategy: generic (review and customize for your environment)
# Verification method: Verify that the dynamic linker search path only references trusted directories, LD_PRELOAD/LD_LIBRARY_PATH are cleared for services, and no world-writable directories appear in library search paths.


- name: "CME-507 | Remediation requires environment-specific configuration"
  ansible.builtin.debug:
    msg: >-
      CME-507 (Secure Dynamic Linker Configuration (LD_PRELOAD/PATH Hardening)) remediation depends on your
      environment configuration. Override this role's tasks/main.yml
      with site-specific remediation steps.
  when: not (cme_507_custom_remediation | default(false))

- name: "CME-507 | Verify current state"
  ansible.builtin.include_tasks: verify.yml
