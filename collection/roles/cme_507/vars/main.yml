cme_cvss_vector_impacts: [{"metric": "AC", "from": "L", "to": "H", "rationale": "With LD_PRELOAD and LD_LIBRARY_PATH cleared for services and library search paths restricted to trusted directories, the attacker cannot simply place a malicious shared library in a writable directory and have it loaded by a privileged process. Exploitation requires either modifying a trusted directory (which requires elevated privileges or a separate vulnerability), exploiting a service that explicitly loads libraries from untrusted paths (an application-level bug), or finding an alternative code injection vector beyond the hardened dynamic linker configuration."}]
