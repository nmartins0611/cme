---
# CME-508: Quoted Service Path Enforcement (Windows)
# Remediation strategy: generic (review and customize for your environment)
# Verification method: Enumerate all Windows services and scheduled tasks with unquoted paths containing spaces, and verify filesystem ACLs on path prefix directories

- name: "CME-508 | Remediation requires environment-specific configuration"
  ansible.builtin.debug:
    msg: >-
      CME-508 (Quoted Service Path Enforcement (Windows)) remediation depends on your
      environment configuration. Override this role's tasks/main.yml
      with site-specific remediation steps.
  when: not (cme_508_custom_remediation | default(false))

- name: "CME-508 | Verify current state"
  ansible.builtin.include_tasks: verify.yml
