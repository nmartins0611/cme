---
# CME-601: Kernel-Level Syscall Filtering (seccomp)
# Remediation strategy: generic (review and customize for your environment)
# Verification method: Check process seccomp status

- name: "CME-601 | Remediation requires environment-specific configuration"
  ansible.builtin.debug:
    msg: >-
      CME-601 (Kernel-Level Syscall Filtering (seccomp)) remediation depends on your
      environment configuration. Override this role's tasks/main.yml
      with site-specific remediation steps.
  when: not (cme_601_custom_remediation | default(false))

- name: "CME-601 | Verify current state"
  ansible.builtin.include_tasks: verify.yml
