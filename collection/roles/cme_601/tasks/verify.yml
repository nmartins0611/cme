---
# CME-601: Kernel-Level Syscall Filtering (seccomp)
# Verification: Check process seccomp status

- name: "CME-601 | Run verification command"
  ansible.builtin.shell:
    cmd: "grep Seccomp /proc/<pid>/status"
  register: cme_601_verify_0
  changed_when: false
  failed_when: false
  when: ansible_os_family != 'Windows'

- name: "CME-601 | Assert control is active"
  ansible.builtin.assert:
    that:
      - "cme_601_verify_0.stdout is search('Seccomp:	2')"
    fail_msg: "CME-601 FAILED — expected 'Seccomp:	2'"
    success_msg: "CME-601 PASSED — Kernel-Level Syscall Filtering (seccomp)"
  ignore_errors: true
  register: cme_601_assert_0
  when: ansible_os_family != 'Windows' and cme_601_verify_0 is not skipped

- name: "CME-601 | Record result"
  ansible.builtin.set_fact:
    cme_results: "{{ (cme_results | default([])) + [{'cme_id': 'CME-601', 'control_name': 'Kernel-Level Syscall Filtering (seccomp)', 'tactic': 'Harden', 'category': 'Syscall & BPF Controls', 'control_layer': 'OS/Kernel', 'confidence': 'High', 'status': ((cme_601_assert_0 is defined and cme_601_assert_0 is not failed) | ternary('passed', 'failed')), 'detail': ((cme_601_assert_0 is defined) | ternary(cme_601_assert_0.msg | default(''), 'not checked'))}] }}"
