---
# CME-602: seccomp-bpf Profile (Container Default)
# Verification: Verify container runtime has seccomp profile applied


- name: "CME-602 | Run verification command (linux)"
  ansible.builtin.shell:
    cmd: "podman inspect <container> | grep -A5 SecurityOpt"
  register: cme_602_verify_0
  changed_when: false
  failed_when: false
  when: ansible_os_family != 'Windows'

- name: "CME-602 | Assert control is active (linux)"
  ansible.builtin.assert:
    that:
      - "cme_602_verify_0.stdout is search('seccomp')"
    fail_msg: "CME-602 FAILED — expected 'seccomp'"
    success_msg: "CME-602 PASSED — seccomp-bpf Profile (Container Default)"
  ignore_errors: true
  register: cme_602_assert_0
  when: ansible_os_family != 'Windows' and cme_602_verify_0 is not skipped

- name: "CME-602 | Run verification command (kubernetes)"
  ansible.builtin.shell:
    cmd: "kubectl get pod <pod> -o jsonpath='{.spec.securityContext.seccompProfile.type}'"
  register: cme_602_verify_1
  changed_when: false
  failed_when: false
  when: cme_kubernetes_host | default(false)

- name: "CME-602 | Assert control is active (kubernetes)"
  ansible.builtin.assert:
    that:
      - "cme_602_verify_1.stdout is search('RuntimeDefault')"
    fail_msg: "CME-602 FAILED — expected 'RuntimeDefault'"
    success_msg: "CME-602 PASSED — seccomp-bpf Profile (Container Default)"
  ignore_errors: true
  register: cme_602_assert_1
  when: cme_kubernetes_host | default(false) and cme_602_verify_1 is not skipped

- name: "CME-602 | Record result"
  ansible.builtin.set_fact:
    cme_results: "{{ (cme_results | default([])) + [{'cme_id': 'CME-602', 'control_name': 'seccomp-bpf Profile (Container Default)', 'tactic': 'Harden', 'category': 'Syscall & BPF Controls', 'control_layer': 'OS/Kernel', 'confidence': 'High', 'status': ((((cme_602_assert_0 is not defined or cme_602_assert_0 is not failed) and (cme_602_assert_1 is not defined or cme_602_assert_1 is not failed)) and (cme_602_assert_0 is defined or cme_602_assert_1 is defined)) | ternary('passed', 'failed')), 'detail': ([((cme_602_assert_0 is defined and cme_602_assert_0 is failed) | ternary(cme_602_assert_0.msg | default(''), '')), ((cme_602_assert_1 is defined and cme_602_assert_1 is failed) | ternary(cme_602_assert_1.msg | default(''), ''))] | reject('equalto', '') | join(' | ') | default('all checks passed'))}] }}"
