---
# CME-702: Linux Namespaces (User, PID, Network, Mount)
# Verification: Check process namespace isolation

- name: "CME-702 | Skip if disabled"
  ansible.builtin.meta: end_role
  when: cme_702_skip | default(false)

- name: "CME-702 | Run verification command"
  ansible.builtin.shell:
    cmd: "ls -la /proc/<pid>/ns/"
  register: cme_702_verify_0
  changed_when: false
  failed_when: false
  when: ansible_os_family != 'Windows'

- name: "CME-702 | Assert control is active"
  ansible.builtin.assert:
    that:
      - "cme_702_verify_0.stdout is search('user mnt pid net')"
    fail_msg: "CME-702 FAILED — expected 'user mnt pid net'"
    success_msg: "CME-702 PASSED — Linux Namespaces (User, PID, Network, Mount)"
  ignore_errors: true
  register: cme_702_assert_0
  when: ansible_os_family != 'Windows' and cme_702_verify_0 is not skipped

- name: "CME-702 | Record result"
  ansible.builtin.set_fact:
    cme_results: "{{ (cme_results | default([])) + [{'cme_id': 'CME-702', 'control_name': 'Linux Namespaces (User, PID, Network, Mount)', 'tactic': 'Isolate', 'category': 'Container Isolation', 'control_layer': 'OS/Kernel', 'confidence': 'High', 'status': ((cme_702_assert_0 is defined and cme_702_assert_0 is not failed) | ternary('passed', 'failed')), 'detail': ((cme_702_assert_0 is defined) | ternary(cme_702_assert_0.msg | default(''), 'not checked'))}] }}"
