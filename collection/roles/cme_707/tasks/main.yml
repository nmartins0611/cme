---
# CME-707: NoNewPrivileges
# Remediation strategy: generic (review and customize for your environment)
# Verification method: Check NoNewPrivs flag on process

- name: "CME-707 | Remediation requires environment-specific configuration"
  ansible.builtin.debug:
    msg: >-
      CME-707 (NoNewPrivileges) remediation depends on your
      environment configuration. Override this role's tasks/main.yml
      with site-specific remediation steps.
  when: not (cme_707_custom_remediation | default(false))

- name: "CME-707 | Verify current state"
  ansible.builtin.include_tasks: verify.yml
