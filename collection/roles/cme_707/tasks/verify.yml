---
# CME-707: NoNewPrivileges
# Verification: Check NoNewPrivs flag on process

- name: "CME-707 | Skip if disabled"
  ansible.builtin.meta: end_role
  when: cme_707_skip | default(false)

- name: "CME-707 | Run verification command"
  ansible.builtin.shell:
    cmd: "grep NoNewPrivs /proc/<pid>/status"
  register: cme_707_verify_0
  changed_when: false
  failed_when: false
  when: ansible_os_family != 'Windows'

- name: "CME-707 | Assert control is active"
  ansible.builtin.assert:
    that:
      - "cme_707_verify_0.stdout is search('NoNewPrivs:	1')"
    fail_msg: "CME-707 FAILED — expected 'NoNewPrivs:	1'"
    success_msg: "CME-707 PASSED — NoNewPrivileges"
  ignore_errors: true
  register: cme_707_assert_0
  when: ansible_os_family != 'Windows' and cme_707_verify_0 is not skipped

- name: "CME-707 | Record result"
  ansible.builtin.set_fact:
    cme_results: "{{ (cme_results | default([])) + [{'cme_id': 'CME-707', 'control_name': 'NoNewPrivileges', 'tactic': 'Isolate', 'category': 'Privilege Isolation', 'control_layer': 'OS/Kernel', 'confidence': 'High', 'status': ((cme_707_assert_0 is defined and cme_707_assert_0 is not failed) | ternary('passed', 'failed')), 'detail': ((cme_707_assert_0 is defined) | ternary(cme_707_assert_0.msg | default(''), 'not checked'))}] }}"
