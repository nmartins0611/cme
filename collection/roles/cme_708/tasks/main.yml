---
# CME-708: Least Privilege sudo Configuration
# Remediation strategy: generic (review and customize for your environment)
# Verification method: Audit sudoers for overly permissive rules

- name: "CME-708 | Skip if disabled"
  ansible.builtin.meta: end_role
  when: cme_708_skip | default(false)

- name: "CME-708 | Remediation requires environment-specific configuration"
  ansible.builtin.debug:
    msg: >-
      CME-708 (Least Privilege sudo Configuration) remediation depends on your
      environment configuration. Override this role's tasks/main.yml
      with site-specific remediation steps.
  when: not (cme_708_custom_remediation | default(false))

- name: "CME-708 | Verify current state"
  ansible.builtin.include_tasks: verify.yml
