---
# CME-708: Least Privilege sudo Configuration
# Verification: Audit sudoers for overly permissive rules

- name: "CME-708 | Run verification command"
  ansible.builtin.shell:
    cmd: "grep -r 'ALL=(ALL)' /etc/sudoers /etc/sudoers.d/ 2>/dev/null | grep -v NOPASSWD"
  register: cme_708_verify_0
  changed_when: false
  failed_when: false
  when: ansible_os_family != 'Windows'

- name: "CME-708 | Assert control is active"
  ansible.builtin.assert:
    that:
      - "cme_708_verify_0.stdout is search('Minimal matches')"
    fail_msg: "CME-708 FAILED — expected 'Minimal matches'"
    success_msg: "CME-708 PASSED — Least Privilege sudo Configuration"
  ignore_errors: true
  register: cme_708_assert_0
  when: ansible_os_family != 'Windows' and cme_708_verify_0 is not skipped

- name: "CME-708 | Record result"
  ansible.builtin.set_fact:
    cme_results: "{{ (cme_results | default([])) + [{'cme_id': 'CME-708', 'control_name': 'Least Privilege sudo Configuration', 'tactic': 'Isolate', 'category': 'Privilege Isolation', 'control_layer': 'OS/Kernel', 'confidence': 'Medium', 'status': ((cme_708_assert_0 is defined and cme_708_assert_0 is not failed) | ternary('passed', 'failed')), 'detail': ((cme_708_assert_0 is defined) | ternary(cme_708_assert_0.msg | default(''), 'not checked'))}] }}"
