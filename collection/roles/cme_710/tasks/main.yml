---
# CME-710: DynamicUser (systemd)
# Remediation strategy: generic (review and customize for your environment)
# Verification method: Check DynamicUser setting

- name: "CME-710 | Remediation requires environment-specific configuration"
  ansible.builtin.debug:
    msg: >-
      CME-710 (DynamicUser (systemd)) remediation depends on your
      environment configuration. Override this role's tasks/main.yml
      with site-specific remediation steps.
  when: not (cme_710_custom_remediation | default(false))

- name: "CME-710 | Verify current state"
  ansible.builtin.include_tasks: verify.yml
