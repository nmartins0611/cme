---
# CME-710: DynamicUser (systemd)
# Verification: Check DynamicUser setting

- name: "CME-710 | Skip if disabled"
  ansible.builtin.meta: end_role
  when: cme_710_skip | default(false)

- name: "CME-710 | Run verification command"
  ansible.builtin.shell:
    cmd: "systemctl show <service> -p DynamicUser"
  register: cme_710_verify_0
  changed_when: false
  failed_when: false
  when: ansible_os_family != 'Windows'

- name: "CME-710 | Assert control is active"
  ansible.builtin.assert:
    that:
      - "cme_710_verify_0.stdout is search('DynamicUser=yes')"
    fail_msg: "CME-710 FAILED — expected 'DynamicUser=yes'"
    success_msg: "CME-710 PASSED — DynamicUser (systemd)"
  ignore_errors: true
  register: cme_710_assert_0
  when: ansible_os_family != 'Windows' and cme_710_verify_0 is not skipped

- name: "CME-710 | Record result"
  ansible.builtin.set_fact:
    cme_results: "{{ (cme_results | default([])) + [{'cme_id': 'CME-710', 'control_name': 'DynamicUser (systemd)', 'tactic': 'Isolate', 'category': 'Privilege Isolation', 'control_layer': 'OS/Kernel', 'confidence': 'High', 'status': ((cme_710_assert_0 is defined and cme_710_assert_0 is not failed) | ternary('passed', 'failed')), 'detail': ((cme_710_assert_0 is defined) | ternary(cme_710_assert_0.msg | default(''), 'not checked'))}] }}"
