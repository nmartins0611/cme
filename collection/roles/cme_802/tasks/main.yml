---
# CME-802: Password Quality Enforcement (pwquality)
# Remediation strategy: generic (review and customize for your environment)
# Verification method: Check pwquality configuration

- name: "CME-802 | Remediation requires environment-specific configuration"
  ansible.builtin.debug:
    msg: >-
      CME-802 (Password Quality Enforcement (pwquality)) remediation depends on your
      environment configuration. Override this role's tasks/main.yml
      with site-specific remediation steps.
  when: not (cme_802_custom_remediation | default(false))

- name: "CME-802 | Verify current state"
  ansible.builtin.include_tasks: verify.yml
