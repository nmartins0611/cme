---
# CME-805: Credential Rotation Policy
# Remediation strategy: generic (review and customize for your environment)
# Verification method: Check password aging and secret rotation policies

- name: "CME-805 | Remediation requires environment-specific configuration"
  ansible.builtin.debug:
    msg: >-
      CME-805 (Credential Rotation Policy) remediation depends on your
      environment configuration. Override this role's tasks/main.yml
      with site-specific remediation steps.
  when: not (cme_805_custom_remediation | default(false))

- name: "CME-805 | Verify current state"
  ansible.builtin.include_tasks: verify.yml
