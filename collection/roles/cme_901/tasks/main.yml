---
# CME-901: SSH Hardening (Comprehensive)
# Remediation strategy: generic (review and customize for your environment)
# Verification method: Audit sshd configuration

- name: "CME-901 | Remediation requires environment-specific configuration"
  ansible.builtin.debug:
    msg: >-
      CME-901 (SSH Hardening (Comprehensive)) remediation depends on your
      environment configuration. Override this role's tasks/main.yml
      with site-specific remediation steps.
  when: not (cme_901_custom_remediation | default(false))

- name: "CME-901 | Verify current state"
  ansible.builtin.include_tasks: verify.yml
