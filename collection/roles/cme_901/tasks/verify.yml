---
# CME-901: SSH Hardening (Comprehensive)
# Verification: Audit sshd configuration

- name: "CME-901 | Run verification command"
  ansible.builtin.shell:
    cmd: "sshd -T | grep -E 'permitrootlogin|maxauthtries|x11forwarding'"
  register: cme_901_verify_0
  changed_when: false
  failed_when: false
  when: ansible_os_family != 'Windows'

- name: "CME-901 | Assert control is active"
  ansible.builtin.assert:
    that:
      - "cme_901_verify_0.stdout is search('permitrootlogin no')"
    fail_msg: "CME-901 FAILED — expected 'permitrootlogin no'"
    success_msg: "CME-901 PASSED — SSH Hardening (Comprehensive)"
  ignore_errors: true
  register: cme_901_assert_0
  when: ansible_os_family != 'Windows' and cme_901_verify_0 is not skipped

- name: "CME-901 | Record result"
  ansible.builtin.set_fact:
    cme_results: "{{ (cme_results | default([])) + [{'cme_id': 'CME-901', 'control_name': 'SSH Hardening (Comprehensive)', 'tactic': 'Harden', 'category': 'Protocol Hardening', 'control_layer': 'Network', 'confidence': 'High', 'status': ((cme_901_assert_0 is defined and cme_901_assert_0 is not failed) | ternary('passed', 'failed')), 'detail': ((cme_901_assert_0 is defined) | ternary(cme_901_assert_0.msg | default(''), 'not checked'))}] }}"
