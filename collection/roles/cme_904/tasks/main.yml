---
# CME-904: WAF (Web Application Firewall)
# This control requires manual/context-specific remediation.
# Running verification only.

- name: "CME-904 | Skip if disabled"
  ansible.builtin.meta: end_role
  when: cme_904_skip | default(false)

- name: "CME-904 | Set manual remediation required"
  ansible.builtin.set_fact:
    cme_904_manual_remediation_required: true

- name: "CME-904 | Run verification"
  ansible.builtin.include_tasks: verify.yml
