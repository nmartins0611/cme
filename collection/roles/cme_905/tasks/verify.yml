---
# CME-905: Content Security Policy (CSP) Headers
# Verification: Check for CSP header in HTTP responses

- name: "CME-905 | Run verification command"
  ansible.builtin.shell:
    cmd: "curl -sI http://target/ | grep -i content-security-policy"
  register: cme_905_verify_0
  changed_when: false
  failed_when: false

- name: "CME-905 | Assert control is active"
  ansible.builtin.assert:
    that:
      - "cme_905_verify_0.stdout is search('Content-Security-Policy:')"
    fail_msg: "CME-905 FAILED — expected 'Content-Security-Policy:'"
    success_msg: "CME-905 PASSED — Content Security Policy (CSP) Headers"
  ignore_errors: true
  register: cme_905_assert_0
  when: cme_905_verify_0 is not skipped

- name: "CME-905 | Record result"
  ansible.builtin.set_fact:
    cme_results: "{{ (cme_results | default([])) + [{'cme_id': 'CME-905', 'control_name': 'Content Security Policy (CSP) Headers', 'tactic': 'Harden', 'category': 'Application Controls', 'control_layer': 'Application', 'confidence': 'Medium', 'status': ((cme_905_assert_0 is defined and cme_905_assert_0 is not failed) | ternary('passed', 'failed')), 'detail': ((cme_905_assert_0 is defined) | ternary(cme_905_assert_0.msg | default(''), 'not checked'))}] }}"
