---
# CME-906: Rate Limiting / Connection Throttling
# This control requires manual/context-specific remediation.
# Running verification only.

- name: "CME-906 | Skip if disabled"
  ansible.builtin.meta: end_role
  when: cme_906_skip | default(false)

- name: "CME-906 | Set manual remediation required"
  ansible.builtin.set_fact:
    cme_906_manual_remediation_required: true

- name: "CME-906 | Run verification"
  ansible.builtin.include_tasks: verify.yml
