---
# CME-907: Application-Layer RBAC Enforcement
# This control requires manual/context-specific remediation.
# Running verification only.

- name: "CME-907 | Skip if disabled"
  ansible.builtin.meta: end_role
  when: cme_907_skip | default(false)

- name: "CME-907 | Set manual remediation required"
  ansible.builtin.set_fact:
    cme_907_manual_remediation_required: true

- name: "CME-907 | Run verification"
  ansible.builtin.include_tasks: verify.yml
