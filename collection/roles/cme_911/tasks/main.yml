---
# CME-911: Fine-Grained Administrative Permission Scoping
# This control requires manual/context-specific remediation.
# Running verification only.

- name: "CME-911 | Skip if disabled"
  ansible.builtin.meta: end_role
  when: cme_911_skip | default(false)

- name: "CME-911 | Set manual remediation required"
  ansible.builtin.set_fact:
    cme_911_manual_remediation_required: true

- name: "CME-911 | Run verification"
  ansible.builtin.include_tasks: verify.yml
