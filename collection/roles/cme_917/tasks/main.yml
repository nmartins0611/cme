---
# CME-917: Worker Process Recycling (MaxConnectionsPerChild / max_requests)
# This control requires manual/context-specific remediation.
# Running verification only.

- name: "CME-917 | Skip if disabled"
  ansible.builtin.meta: end_role
  when: cme_917_skip | default(false)

- name: "CME-917 | Set manual remediation required"
  ansible.builtin.set_fact:
    cme_917_manual_remediation_required: true

- name: "CME-917 | Run verification"
  ansible.builtin.include_tasks: verify.yml
